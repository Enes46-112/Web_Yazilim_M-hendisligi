    <h1> Sırasız Listeler</h1>
    <!-- Sırasız listelerde type parametresinin görevi CSS'e 
     devredilmiştir.CSS madde işaretini değiştirme yüntemini

      kullanılır.
      madde işaretini kalsırmak için none kullanılır -->
    <ul style="list-style-type:none;">
        <li> Yumurta</li>
        <li>Süt</li>
        <li>kitap</li>

    </ul>
