<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ders 9 - Site ve Harita Gömmek(İframe)</title>
    </head>
    <body>
        <h1>Site ve Harita Gömmek(İframe)</h1>

        <h2>Eğitim Videomuz</h2>

        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/_VwO5aZLGDk?si=gGszhbz9orbWog6z"
            title="YouTube video player"
            frameborder="0"
            allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share;
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
        ></iframe>

        <h2>Google Haritalsı Gömme</h2>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d11992.842986020345!2d31.414657569775404!3d41.28251759999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x409c44b0edfa94fd%3A0xef5798ee791b8882!2sKdz.Ere%C4%9Fli%20Belediyesi!5e0!3m2!1str!2str!4v1793126465187!5m2!1str!2str"
            width="600"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
    </body>
</html>
